{% load slot_tags %}
{# Шаблон компонента top_free_slots (inclusion_tag). #}
{% if slots %}
<div class="mb-4">
  <div class="fw-bold small mb-2"><i class="bi bi-lightning-charge-fill text-warning"></i> Больше всего свободных мест:</div>
  <div class="d-flex flex-wrap gap-2">
    {% for s in slots %}
      <a class="recent-chip" href="{% url 'book_slot' s.id %}"><i class="bi bi-book"></i>{{ s.subject.title }} · {{ s.date_time|date:"d.m H:i" }} · {{ s.free|ru_places }}</a>
    {% endfor %}
  </div>
</div>
{% endif %}
