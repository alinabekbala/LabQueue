{# Компонент пагинации (inclusion_tag pagination): показывается, если страниц больше одной. #}
{% if page_obj.paginator.num_pages > 1 %}
<nav aria-label="Страницы" class="my-4">
  <ul class="pagination justify-content-center flex-wrap mb-0">
    <li class="page-item {% if not prev_url %}disabled{% endif %}">
      <a class="page-link" href="{% if prev_url %}{{ prev_url }}{% else %}#{% endif %}" aria-label="Назад"><i class="bi bi-chevron-left"></i></a>
    </li>
    {% for item in items %}
      {% if item.gap %}
        <li class="page-item disabled"><span class="page-link">…</span></li>
      {% else %}
        <li class="page-item {% if item.current %}active{% endif %}">
          <a class="page-link" href="{{ item.url }}" {% if item.current %}aria-current="page"{% endif %}>{{ item.number }}</a>
        </li>
      {% endif %}
    {% endfor %}
    <li class="page-item {% if not next_url %}disabled{% endif %}">
      <a class="page-link" href="{% if next_url %}{{ next_url }}{% else %}#{% endif %}" aria-label="Вперёд"><i class="bi bi-chevron-right"></i></a>
    </li>
  </ul>
</nav>
{% endif %}
