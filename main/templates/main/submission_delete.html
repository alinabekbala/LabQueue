{% extends 'main/base.html' %}
{% block title %}Удаление записи{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="sticker p-4">
    <h1 class="h4 page-title"><i class="bi bi-exclamation-triangle"></i> Удалить запись?</h1>
    <p class="fs-5">Студент <strong>{{ submission.student_name }}</strong> ({{ submission.group_name }}), лаба №{{ submission.lab_number }}.</p>
    <form method="post">{% csrf_token %}
      <button class="btn btn-danger-soft">Да, удалить</button>
      <a href="{% url 'submission_list' %}" class="btn btn-outline-ink">Отмена</a>
    </form>
  </div>
</div></div>
{% endblock %}
